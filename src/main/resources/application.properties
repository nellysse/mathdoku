# ── Datasource ──────────────────────────────────────────────
# По умолчанию — встроенная H2 (для локальной разработки).
# В продакшене переопределяется через переменные окружения.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:sudoku_db;DB_CLOSE_DELAY=-1}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
# Драйвер определяется автоматически по URL (H2 или PostgreSQL)

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── H2 Console (только для разработки) ─────────────────────
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ── CORS ───────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Server ─────────────────────────────────────────────────
server.port=${PORT:8080}